[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-gatekeeper"
version = "0.1.0"
description = "Let AI agents auto-approve minor PRs and escalate major ones to humans."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
pr-gatekeeper = "pr_gatekeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

