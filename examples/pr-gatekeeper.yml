name: PR Gatekeeper
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  # Re-run when CI finishes: a minor, clean PR whose CI was still running gets approved then.
  workflow_run:
    workflows: ["CI"]          # <- name(s) of your CI workflow(s)
    types: [completed]

permissions:
  contents: read
  pull-requests: write   # post reviews + labels
  checks: read           # read CI status
  statuses: read

jobs:
  gatekeeper:              # keep this name: it's in `ignore_checks` so the gate doesn't wait on itself
    runs-on: ubuntu-latest
    # Skip fork PRs (untrusted diff, no secrets) and workflow_runs that aren't tied to a PR.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.pull_requests[0] != null &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      # Use trusted config: the PR's base commit (pull_request) or the default branch (workflow_run),
      # never the PR's own files, so a PR can't loosen its own policy.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install 'pr-gatekeeper[anthropic]'   # drop the extra if you use another provider; or: pip install git+https://<your-repo>
      - run: >
          pr-gatekeeper --repo "${{ github.repository }}"
          --pr ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # or OPENAI_API_KEY for provider: openai
